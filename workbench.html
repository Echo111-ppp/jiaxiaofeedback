<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自媒体创作工作台</title>
<style>
  :root {
    --primary: #2f6fed;
    --primary-dark: #1e55d6;
    --primary-bg: #eef4ff;
    --bg: #f3f6fb;
    --card: #ffffff;
    --border: #e2e9f2;
    --text: #26323f;
    --muted: #6d7b8c;
    --danger: #e5484d;
    --danger-bg: #fdecec;
    --warning: #d97706;
    --warning-bg: #fef4e6;
    --success: #16a34a;
    --success-bg: #e9f7ef;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(28, 45, 70, 0.06), 0 4px 14px rgba(28, 45, 70, 0.05);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    line-height: 1.6;
  }
  .topbar { background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 30; }
  .topbar-inner {
    max-width: 1220px; margin: 0 auto; padding: 12px 20px 0;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 11px; flex: none;
    background: linear-gradient(135deg, #2f6fed, #f15a8e);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: bold; box-shadow: 0 3px 8px rgba(60, 90, 200, 0.22);
  }
  .brand h1 { margin: 0; font-size: 19px; letter-spacing: 0.5px; white-space: nowrap; }
  .brand small { display: block; color: var(--muted); font-size: 12px; letter-spacing: 0.5px; }
  .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .tabs { max-width: 1220px; margin: 0 auto; padding: 0 20px; display: flex; gap: 4px; overflow-x: auto; }
  .tab {
    border: none; background: transparent; cursor: pointer; font-family: inherit;
    font-size: 15px; color: var(--muted); padding: 12px 15px 11px; position: relative;
    white-space: nowrap;
  }
  .tab.active { color: var(--primary); font-weight: 600; }
  .tab.active::after {
    content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px;
    height: 3px; border-radius: 3px 3px 0 0; background: var(--primary);
  }
  .tab .badge-count {
    display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px;
    border-radius: 9px; background: var(--primary-bg); color: var(--primary-dark);
    font-size: 11px; font-weight: 600; text-align: center;
  }
  main { max-width: 1220px; margin: 0 auto; padding: 22px 20px 50px; }
  .view { animation: fade .18s ease; }
  @keyframes fade { from { opacity: .4; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-pad { padding: 18px; }
  .card + .card { margin-top: 16px; }
  .view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .view-head h2 { margin: 0; font-size: 21px; }
  .view-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    border: none; cursor: pointer; font-family: inherit; font-size: 14px; border-radius: 9px;
    padding: 9px 15px; background: var(--primary); color: #fff; transition: all .15s;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn-sm { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
  .btn-outline { background: #fff; color: var(--primary); border: 1px solid #c9dbfb; }
  .btn-outline:hover { background: var(--primary-bg); }
  .btn-success { background: var(--success); }
  .btn-success:hover { background: #128a3e; }
  .btn-ghost { background: #fff; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { background: #f4f7fb; color: var(--text); }
  .btn-danger { background: #fff; color: var(--danger); border: 1px solid #f3c4c6; }
  .btn-danger:hover { background: var(--danger-bg); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  .stat-card { padding: 15px 17px; }
  .stat-card .label { color: var(--muted); font-size: 13px; }
  .stat-card .num { font-size: 26px; font-weight: 700; margin-top: 2px; }
  .stat-card .sub { color: var(--muted); font-size: 12px; margin-top: 1px; }
  .grid-2 { display: grid; grid-template-columns: 1.25fr .75fr; gap: 16px; align-items: start; }
  .grid-2-equal { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
  .sec-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .sec-title h3 { margin: 0; font-size: 16px; }
  .sec-title .hint { color: var(--muted); font-size: 12px; }
  .empty {
    padding: 30px 16px; text-align: center; color: var(--muted); font-size: 14px;
    background: #fafcff; border: 1px dashed var(--border); border-radius: var(--radius);
  }
  .chip {
    display: inline-block; padding: 1px 9px; border-radius: 20px; font-size: 12px;
    line-height: 1.7; margin: 1px 3px 1px 0;
  }
  .chip-plain { background: #f0f4fa; color: var(--muted); }
  .chip-ok { background: var(--success-bg); color: var(--success); }
  .chip-warn { background: var(--warning-bg); color: var(--warning); }
  .chip-red { background: var(--danger-bg); color: var(--danger); }
  .chip-blue { background: var(--primary-bg); color: var(--primary-dark); }
  .pill {
    display: inline-block; padding: 2px 10px; border-radius: 6px; font-size: 12px;
    white-space: nowrap;
  }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .toolbar .search-input { flex: 1 1 220px; min-width: 180px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--text); margin-bottom: 5px; font-weight: 600; }
  .field label .opt { color: var(--muted); font-weight: normal; }
  .field .help { color: var(--muted); font-size: 12px; margin-top: 3px; }
  input[type=text], input[type=number], input[type=date], select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 9px;
    font-family: inherit; font-size: 14px; color: var(--text); background: #fff; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(47, 111, 237, 0.1); }
  textarea { resize: vertical; min-height: 68px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .filter-row select { width: auto; min-width: 110px; }
  .search-input { position: relative; }
  .search-input input { padding-left: 33px; }
  .search-input .icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }
  .idea-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .idea-card { border: 1px solid var(--border); border-radius: 11px; padding: 13px 14px; background: #fff; }
  .idea-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .idea-title { font-size: 15px; font-weight: 600; margin: 0 0 5px; line-height: 1.45; }
  .idea-tags { margin-top: 6px; }
  .idea-meta { color: var(--muted); font-size: 12px; margin-top: 7px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .hot-score { font-weight: 700; font-size: 13px; white-space: nowrap; }
  .idea-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 11px; padding-top: 10px; border-top: 1px solid #eef2f8; }
  .sample-tag { font-size: 11px; color: #9aa6b4; }
  .tracker-row { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid #eef2f8; flex-wrap: wrap; }
  .tracker-row:last-child { border-bottom: none; }
  .tracker-main { flex: 1 1 260px; min-width: 0; }
  .tracker-title { font-weight: 600; font-size: 14px; }
  .tracker-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .heat-bar { width: 110px; height: 7px; background: #eef2f8; border-radius: 4px; overflow: hidden; }
  .heat-bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffb02e, #ff5b5b); }
  .direction-item { border: 1px solid #e9eef6; border-radius: 10px; padding: 12px 13px; }
  .direction-item h4 { margin: 0 0 4px; font-size: 14px; }
  .direction-item p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .schedule-group { margin-bottom: 16px; }
  .date-head { font-weight: 700; font-size: 14px; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
  .date-head .weekday { color: var(--muted); font-weight: normal; }
  .date-head .today-tag { color: var(--primary); background: var(--primary-bg); padding: 0 8px; border-radius: 10px; font-size: 12px; }
  .schedule-row {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; margin-bottom: 8px; background: #fff;
  }
  .schedule-main { flex: 1 1 260px; min-width: 0; }
  .schedule-title { font-weight: 600; }
  .schedule-meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .schedule-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .stage-select { width: auto; padding: 5px 8px; font-size: 12.5px; border-radius: 7px; }
  .post-row {
    border: 1px solid var(--border); border-radius: 11px; padding: 13px 15px; margin-bottom: 10px; background: #fff;
  }
  .post-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .post-title { font-weight: 600; font-size: 15px; }
  .post-date { color: var(--muted); font-size: 12px; }
  .metric-row { display: flex; gap: 6px 18px; flex-wrap: wrap; margin-top: 10px; color: var(--text); font-size: 13px; }
  .metric-row b { font-size: 15px; }
  .metric-box { text-align: center; }
  .metric-box .v { font-weight: 700; font-size: 15px; }
  .metric-box .k { color: var(--muted); font-size: 11px; }
  .metric-highlight { color: var(--primary); }
  .bar-row { display: grid; grid-template-columns: 92px 1fr 90px; gap: 10px; align-items: center; margin-bottom: 10px; font-size: 13px; }
  .bar-track { height: 12px; background: #edf2f9; border-radius: 7px; overflow: hidden; }
  .bar-track i { display: block; height: 100%; border-radius: 7px; background: linear-gradient(90deg, #5b8cff, #2f6fed); }
  .bar-num { text-align: right; color: var(--muted); font-size: 12px; }
  .top-list .item { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid #eef2f8; font-size: 13px; }
  .top-list .item:last-child { border-bottom: none; }
  .rank {
    width: 23px; height: 23px; border-radius: 7px; background: #f1f5fb; color: var(--muted);
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none;
  }
  .rank.top { background: var(--primary-bg); color: var(--primary-dark); }
  .quick-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .task-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eef2f8; }
  .task-row:last-child { border-bottom: none; }
  .task-stage { flex: none; }
  .modal-mask {
    position: fixed; inset: 0; background: rgba(26, 42, 68, 0.42); z-index: 100;
    display: flex; align-items: flex-start; justify-content: center; padding: 5vh 16px 20px; overflow-y: auto;
  }
  .modal {
    background: #fff; border-radius: 14px; width: 100%; max-width: 680px;
    box-shadow: 0 18px 50px rgba(20, 35, 60, 0.2); animation: pop .16s ease;
  }
  .modal.wide { max-width: 820px; }
  @keyframes pop { from { opacity: .4; transform: scale(.98) translateY(5px); } to { opacity: 1; transform: none; } }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 15px 19px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { margin: 0; font-size: 16px; }
  .modal-x { border: none; background: none; cursor: pointer; font-size: 21px; color: var(--muted); line-height: 1; }
  .modal-x:hover { color: var(--text); }
  .modal-body { padding: 18px 19px; max-height: 68vh; overflow-y: auto; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 9px; padding: 13px 19px; border-top: 1px solid var(--border); }
  .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 20px; }
  .score-item label { display: block; font-size: 12.5px; margin-top: 8px; }
  .score-item input { width: 100%; accent-color: var(--primary); }
  .score-val { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: -3px; }
  .score-total { margin-top: 10px; font-size: 14px; font-weight: 600; }
  .toast-wrap { position: fixed; top: 74px; right: 18px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: #26323f; color: #fff; padding: 10px 15px; border-radius: 10px; font-size: 13px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); animation: pop .16s ease; max-width: 320px;
  }
  .toast.success { background: #128a3e; }
  .toast.danger { background: #c93d43; }
  .link { color: var(--primary); cursor: pointer; background: none; border: none; font-size: 13px; font-family: inherit; padding: 0; }
  .link:hover { text-decoration: underline; }
  .mini-note { background: #f8fbff; border: 1px solid #e2e9f2; border-radius: 9px; padding: 9px 12px; color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
  .metric-edit { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .metric-edit .field { margin-bottom: 0; }
  @media (max-width: 1100px) {
    .idea-list { grid-template-columns: 1fr; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .grid-2, .grid-2-equal, .grid-3 { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .metric-edit { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 640px) {
    .topbar-inner { padding: 10px 14px 0; }
    main { padding: 16px 14px 40px; }
    .tabs { padding: 0 10px; }
    .stat-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-card { padding: 12px; }
    .stat-card .num { font-size: 21px; }
    .metric-edit { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">创</div>
      <div>
        <h1>自媒体创作工作台</h1>
        <small>选题 · 排期 · 复盘，一站式管理你的内容账号</small>
      </div>
    </div>
    <div class="top-actions">
      <button id="btn-export" class="btn btn-ghost btn-sm">导出备份</button>
      <button id="btn-import" class="btn btn-ghost btn-sm">导入备份</button>
      <button id="btn-clear-sample" class="btn btn-ghost btn-sm">清空示例数据</button>
      <input type="file" id="import-file" accept="application/json" hidden>
    </div>
  </div>
  <nav class="tabs" id="main-tabs"></nav>
</div>
<main>
  <section id="view-home" class="view"></section>
  <section id="view-ideas" class="view" hidden></section>
  <section id="view-calendar" class="view" hidden></section>
  <section id="view-posts" class="view" hidden></section>
  <section id="view-dashboard" class="view" hidden></section>
</main>
<div id="modal-root"></div>
<div id="toast-wrap" class="toast-wrap"></div>
<script>
/* ============ 基础信息与常量 ============ */
const LS_KEY = "zmt_workbench_v1";
const PLATFORM_COLORS = {
  "小红书": "#ff2442",
  "抖音": "#26282b",
  "小红书+抖音": "#ff2442",
  "视频号": "#07c160",
  "公众号": "#2a86ff",
  "B站": "#00a1d6",
  "其他": "#7b8794"
};
const PLATFORMS = Object.keys(PLATFORM_COLORS);
const FORMS = ["图文", "短视频", "直播", "其他"];
const IDEA_STATUS = [
  { value: "pool", label: "灵感池", cls: "chip-blue" },
  { value: "adopted", label: "已采用", cls: "chip-ok" },
  { value: "paused", label: "暂缓", cls: "chip-warn" },
  { value: "published", label: "已发布", cls: "chip" },
  { value: "dropped", label: "已放弃", cls: "chip-plain" }
];
const STAGE_STATUS = [
  { value: "draft", label: "草稿", cls: "pill", bg: "#eef1f6", color: "#6d7b8c" },
  { value: "making", label: "制作中", cls: "pill", bg: "#eef4ff", color: "#2f6fed" },
  { value: "ready", label: "待发布", cls: "pill", bg: "#fef4e6", color: "#d97706" },
  { value: "published", label: "已发布", cls: "pill", bg: "#e9f7ef", color: "#16a34a" },
  { value: "shelved", label: "已搁置", cls: "pill", bg: "#f0f1f4", color: "#8a94a3" }
];
const TRACKER_STATUS = [
  { value: "tracking", label: "追踪中", cls: "chip-red" },
  { value: "made", label: "已跟做", cls: "chip-ok" },
  { value: "cold", label: "已过时", cls: "chip-plain" }
];

/* ============ 工具函数 ============ */
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function uid() {
  return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}

function todayStr() { return fmtDate(new Date()); }

function offsetDateStr(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return fmtDate(d);
}

function cnDate(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d.getTime())) return dateStr;
  const week = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][d.getDay()];
  return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + week;
}

function num(v) {
  const n = parseInt(v, 10);
  return isNaN(n) ? 0 : Math.max(0, n);
}

function splitTags(s) {
  return String(s || "").split(/[,，\s]+/).map(t => t.trim()).filter(Boolean).slice(0, 8);
}

function statusMeta(list, value) {
  return list.find(s => s.value === value) || list[0];
}

function platformChip(name) {
  const color = PLATFORM_COLORS[name] || "#7b8794";
  return '<span class="chip" style="background:' + color + "14;color:" + color + '">' + esc(name) + "</span>";
}

function stagePill(stage) {
  const meta = statusMeta(STAGE_STATUS, stage);
  return '<span class="pill" style="background:' + meta.bg + ";color:" + meta.color + '">' + meta.label + "</span>";
}

function fmtNum(n) {
  n = num(n);
  if (n >= 10000) return (n / 10000).toFixed(1) + "w";
  if (n >= 1000) return (n / 1000).toFixed(1) + "k";
  return String(n);
}

/* ============ 状态与本地存储 ============ */
let state = loadState();

function emptyState() {
  return { ideas: [], schedules: [], posts: [], trackers: [], seeded: true };
}

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      return Object.assign(emptyState(), s);
    }
  } catch (e) { /* 损坏数据则重新开始 */ }
  return seedState();
}

function saveState() {
  localStorage.setItem(LS_KEY, JSON.stringify(state));
}

function seedState() {
  const s = emptyState();
  const sample = true;
  s.trackers = [

/* ============ 通用 UI：toast / modal / confirm ============ */
function toast(msg, type) {
  const el = document.createElement("div");
  el.className = "toast" + (type ? " " + type : "");
  el.textContent = msg;
  $("#toast-wrap").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; }, 2300);
  setTimeout(() => el.remove(), 2700);
}

function openModal(title, bodyHtml, footButtons, wide) {
  const root = $("#modal-root");
  root.innerHTML =
    '<div class="modal-mask"><div class="modal' + (wide ? " wide" : "") + '">' +
    '<div class="modal-head"><h3>' + esc(title) + '</h3><button class="modal-x" id="modal-close">&times;</button></div>' +
    '<div class="modal-body">' + bodyHtml + "</div>" +
    '<div class="modal-foot">' + footButtons + "</div>" +
    "</div></div>";
  $("#modal-close").onclick = closeModal;
  root.querySelector(".modal-mask").addEventListener("mousedown", function (e) {
    if (e.target.classList.contains("modal-mask")) closeModal();
  });
}

function closeModal() {
  $("#modal-root").innerHTML = "";
}

function confirmDialog(msg, onOk, okText) {
  const body = '<p style="margin:0">' + esc(msg) + "</p>";
  const buttons =
    '<button class="btn btn-ghost" id="cf-no">取消</button>' +
    '<button class="btn btn-danger" id="cf-yes">' + esc(okText || "确认删除") + "</button>";
  openModal("请确认", body, buttons);
  $("#cf-no").onclick = closeModal;
  $("#cf-yes").onclick = function () { closeModal(); onOk(); };
}

function modalButtons(cancelText, submitText, extra) {
  return '<button class="btn btn-ghost" data-modal-cancel>' + esc(cancelText || "取消") + "</button>" +
    (extra || "") +
    '<button class="btn" type="submit" form="app-form">' + esc(submitText || "保存") + "</button>";
}

/* ============ 热度评估 ============ */
function hotScore(hot) {
  if (!hot) return 0;
  const w = { heat: 0.25, demand: 0.25, fit: 0.2, space: 0.2, urgent: 0.1 };
  let total = 0;
  for (const k in w) total += num(hot[k]) * w[k];
  return Math.round(total * 10);
}

function hotTag(score) {
  if (score >= 75) return '<span class="chip-red">建议优先跟进</span>';
  if (score >= 55) return '<span class="chip-warn">值得观察</span>';
  return '<span class="chip-plain">暂缓</span>';
}

function scoreItemHtml(key, label, value) {
  const v = num(value);
  return '<div class="score-item"><div class="score-val"><span>' + label + '</span><b id="score-out-' + key + '">' + v + "</b></div>" +
    '<input type="range" id="score-in-' + key + '" min="0" max="10" step="1" value="' + v + '"></div>';
}

function bindScores() {
  const keys = ["heat", "demand", "fit", "space", "urgent"];
  keys.forEach(function (key) {
    const input = $("#score-in-" + key);
    if (!input) return;
    input.oninput = function () {
      const out = $("#score-out-" + key);
      if (out) out.textContent = input.value;
      refreshScoreTotal();
    };
  });
}

function refreshScoreTotal() {
  const keys = ["heat", "demand", "fit", "space", "urgent"];
  const hot = {};
  keys.forEach(function (key) {
    const input = $("#score-in-" + key);
    hot[key] = input ? num(input.value) : 0;
  });
  const total = hotScore(hot);
  const box = $("#score-total");
  if (box) box.innerHTML = "综合热度：<b>" + total + " 分</b>　" + hotTag(total);
}

function collectHotFromForm() {
  const keys = ["heat", "demand", "fit", "space", "urgent"];
  const hot = {};
  keys.forEach(function (key) {
    const input = $("#score-in-" + key);
    hot[key] = input ? num(input.value) : 0;
  });
  return hot;
}

function renderTabs() {
  const poolCount = state.ideas.filter(i => i.status === "pool").length;
  const readyCount = state.schedules.filter(s => s.stage === "ready").length;
  const badges = { home: 0, ideas: poolCount, calendar: readyCount, posts: 0, dashboard: 0 };
  $("#main-tabs").innerHTML = TAB_LIST.map(function (tab) {
    const b = badges[tab.id];
    const badge = b > 0 ? '<span class="badge-count">' + b + "</span>" : "";
    return '<button class="tab' + (tab.id === activeTab ? " active" : "") + '" data-tab="' + tab.id + '">' +
      tab.label + badge + "</button>";
  }).join("");
  $$("#main-tabs .tab").forEach(function (btn) {
    btn.onclick = function () { goTab(btn.dataset.tab); };
  });
}

function goTab(id) {
  activeTab = id;
  renderTabs();
  $$(".view").forEach(function (v) { v.hidden = true; });
  const view = $("#view-" + id);
  view.hidden = false;
  if (id === "home") renderHome();
  else if (id === "ideas") renderIdeas();
  else if (id === "calendar") renderCalendar();
  else if (id === "posts") renderPosts();
  else if (id === "dashboard") renderDashboard();
  window.scrollTo({ top: 0 });
}

function postEngagement(p) {
  const reads = num(p.reads);
  if (reads <= 0) return 0;
  return (num(p.likes) + num(p.comments) + num(p.collects) + num(p.shares)) / reads * 100;
}

function bindIdeaFilters() {
  const search = $("#idea-search");
  const pf = $("#idea-pf-filter");
  const st = $("#idea-st-filter");
  const reset = $("#idea-filter-reset");
  if (search) search.oninput = function () {
    const pos = search.selectionStart;
    ideaFilter.q = search.value;
    renderIdeas();
    const next = $("#idea-search");
    if (next) { next.focus(); next.setSelectionRange(pos, pos); }
  };
  if (pf) pf.onchange = function () { ideaFilter.platform = pf.value; renderIdeas(); };
  if (st) st.onchange = function () { ideaFilter.status = st.value; renderIdeas(); };
  if (reset) reset.onclick = function () {
    ideaFilter.q = "";
    ideaFilter.platform = "all";
    ideaFilter.status = "all";
    renderIdeas();
  };
}

    scoreItemHtml("fit", "与我的契合度", hot.fit) +

function adoptTrackerToIdea(trackerId) {
  const t = state.trackers.find(function (x) { return x.id === trackerId; });
  if (!t) return;
  const exists = state.ideas.some(function (i) { return i.title === t.keyword; });
  if (exists) {
    toast("这条热点已经在选题库里了", "danger");
    return;
  }
  const score = { heat: num(t.heat), demand: 6, fit: 5, space: 6, urgent: 6 };
  state.ideas.unshift({
    id: uid(),
    title: t.keyword,
    platforms: [t.platform],
    form: t.platform === "抖音" ? "短视频" : "图文",
    audience: "",
    source: "热点",
    status: "pool",
    tags: ["热点"],
    note: "来自热点雷达：" + (t.note || "待补充角度"),
    hot: score,
    sample: false,
    createdAt: new Date().toISOString()
  });
  saveState();
  goTab("ideas");
  ideaFilter.q = t.keyword;
  toast("已转成选题，填入真实感后再打磨角度");
}

    renderIdeas();
    toast("已删除热点");

}

/* ============ 排期日历 ============ */
function renderCalendar() {
  const stageOptions = STAGE_STATUS.map(function (s) {
    return '<option value="' + s.value + '">' + s.label + "</option>";
  }).join("");
  const filterChips =
    '<button class="btn btn-sm ' + (calFilter.stage === "all" ? "btn" : "btn-ghost") + '" data-stage-filter="all">全部</button>' +
    STAGE_STATUS.map(function (s) {
      return '<button class="btn btn-sm ' + (calFilter.stage === s.value ? "btn" : "btn-ghost") + '" data-stage-filter="' + s.value + '">' + s.label + "</button>";
    }).join("");
  const items = state.schedules.filter(function (s) {
    return calFilter.stage === "all" || s.stage === calFilter.stage;
  }).sort(byDateAsc);

  const grouped = {};
  items.forEach(function (s) {
    if (!grouped[s.date]) grouped[s.date] = [];
    grouped[s.date].push(s);
  });
  const today = todayStr();
  const groupsHtml = Object.keys(grouped).sort().map(function (date) {
    const rows = grouped[date].map(function (s) {
      const pubBtn = s.stage === "published"
        ? '<button class="btn btn-sm btn-outline" data-add-post-schedule="' + s.id + '">登记数据</button>'
        : "";
      return '<div class="schedule-row">' +
        '<div class="schedule-main"><div class="schedule-title">' + esc(s.title) +
        (s.sample ? ' <span class="sample-tag">示例</span>' : "") + "</div>" +
        '<div class="schedule-meta">' + platformChip(s.platform) + '<span class="chip chip-plain">' + esc(s.form) + "</span>" +
        (s.note ? " " + esc(s.note) : "") + "</div></div>" +
        '<select class="stage-select" data-stage-change="' + s.id + '">' +
        STAGE_STATUS.map(function (st) {
          return '<option value="' + st.value + '"' + (s.stage === st.value ? " selected" : "") + ">" + st.label + "</option>";
        }).join("") + "</select>" +
        '<div class="schedule-actions">' + pubBtn +
        '<button class="btn btn-sm btn-outline" data-edit-schedule="' + s.id + '">编辑</button>' +
        '<button class="btn btn-sm btn-danger" data-del-schedule="' + s.id + '">删除</button></div></div>';
    }).join("");
    const tag = date === today ? '<span class="today-tag">今天</span>' : "";
    return '<div class="schedule-group"><div class="date-head">' + cnDate(date) + tag + "</div>" + rows + "</div>";
  }).join("");

  $("#view-calendar").innerHTML =
    '<div class="view-head"><div><h2>排期日历</h2><p>安排什么时间做哪条内容，标记“已发布”后去数据复盘补数据</p></div>' +
    '<div class="head-actions"><button class="btn" onclick="openScheduleModal()">+ 新增排期</button></div></div>' +
    '<div class="card card-pad"><div class="toolbar" style="margin-bottom:12px">' +
    '<div class="sec-title" style="margin:0;flex:1"><h3 style="font-size:15px">按日期查看</h3></div>' +
    filterChips + "</div>" +
    (groupsHtml || '<div class="empty">这个筛选条件下没有排期内容</div>') + "</div>";

  $$("[data-stage-filter]").forEach(function (b) {
    b.onclick = function () { calFilter.stage = b.dataset.stageFilter; renderCalendar(); };
  });
  $$("[data-stage-change]").forEach(function (sel) {
    sel.onchange = function () { changeScheduleStage(sel.dataset.stageChange, sel.value); };
  });
  $$("[data-edit-schedule]").forEach(function (b) {
    b.onclick = function () { openScheduleModal(b.dataset.editSchedule); };
  });
  $$("[data-del-schedule]").forEach(function (b) {
    b.onclick = function () { deleteSchedule(b.dataset.delSchedule); };
  });
  $$("[data-add-post-schedule]").forEach(function (b) {
    b.onclick = function () { addPostFromSchedule(b.dataset.addPostSchedule); };
  });

    "</select></div>" +
    '<div class="field"><label>内容形式</label><select name="form">' +
    FORMS.map(function (f) { return "<option" + ((s ? s.form : (idea ? idea.form : "")) === f ? " selected" : "") + ">" + f + "</option>"; }).join("") +
    "</select></div>" +
    '<div class="field"><label>计划日期</label><input type="date" name="date" required value="' + escAttr(s ? s.date : offsetDateStr(1)) + '"></div>' +
    '<div class="field"><label>阶段</label><select name="stage">' +
    STAGE_STATUS.map(function (st) {
      return '<option value="' + st.value + '"' + (s && s.stage === st.value ? " selected" : "") + ">" + st.label + "</option>";
    }).join("") + "</select></div>" +
    '<div class="field full"><label>备注</label><textarea name="note">' + esc(s ? s.note : "") + "</textarea></div>" +
    "</div></form>";
  openModal(s && s.id ? "编辑排期" : (idea ? "把选题加入排期" : "新增排期"), body, modalButtons("取消", "保存排期"));
  $("#app-form").onsubmit = function (e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const title = String(fd.get("title") || "").trim();
    if (!title) { toast("标题不能为空", "danger"); return; }
    if (s && s.id) {
      s.title = title;
      s.platform = String(fd.get("platform") || "小红书");
      s.form = String(fd.get("form") || "图文");
      s.date = String(fd.get("date") || todayStr());
      s.stage = String(fd.get("stage") || "draft");
      s.note = String(fd.get("note") || "").trim();
    } else {
      const rec = {
        id: uid(),
        title: title,
        platform: String(fd.get("platform") || "小红书"),

        stage: String(fd.get("stage") || "draft"),
        note: String(fd.get("note") || "").trim(),
        sample: false
      };
      state.schedules.push(rec);
      if (idea && (idea.status === "pool" || idea.status === "paused")) {
        idea.status = "adopted";
      }
    }
    saveState();
    closeModal();
    toast("排期已保存");
    goTab("calendar");
    renderTabs();
  };

/* ============ 数据复盘 ============ */
function renderPosts() {
  const list = state.posts.filter(function (p) {
    const q = postFilter.q.trim().toLowerCase();
    const textOk = !q || (p.title + " " + (p.note || "")).toLowerCase().indexOf(q) > -1;
    const pfOk = postFilter.platform === "all" || p.platform === postFilter.platform;
    return textOk && pfOk;
  }).sort(byDateDesc);
  const totalReads = state.posts.reduce(function (sum, p) { return sum + num(p.reads); }, 0);
  const rates = state.posts.map(postEngagement).filter(function (r) { return r > 0; });
  const avgRate = rates.length ? (rates.reduce(function (a, b) { return a + b; }, 0) / rates.length) : 0;
  const maxRead = state.posts.length ? Math.max.apply(null, state.posts.map(function (p) { return num(p.reads); })) : 0;
  const summary =
    statCard("发布记录", String(state.posts.length), "条") +
    statCard("累计阅读", fmtNum(totalReads), "全平台") +
    statCard("平均互动率", avgRate.toFixed(1) + "%", "已录入内容") +
    statCard("单篇最高阅读", fmtNum(maxRead), "历史最高");

  const rows = list.length
    ? list.map(function (p) {
        const rate = postEngagement(p);
        return '<div class="post-row">' +
          '<div class="post-head"><div style="min-width:0"><div class="post-title">' + esc(p.title) +
          (p.sample ? ' <span class="sample-tag">示例</span>' : "") + "</div>" +
          '<div style="margin-top:4px">' + platformChip(p.platform) +
          '<span class="chip chip-plain">' + esc(p.form) + "</span>" +
          '<span class="post-date">发布于 ' + esc(p.publishDate || "") + "</span></div></div>" +
          '<div class="schedule-actions">' +
          '<button class="btn btn-sm btn-outline" data-edit-post="' + p.id + '">编辑</button>' +
          '<button class="btn btn-sm btn-danger" data-del-post="' + p.id + '">删除</button></div></div>' +
          '<div class="metric-row">' +
          metricBox("阅读", p.reads) +
          metricBox("点赞", p.likes) +
          metricBox("评论", p.comments) +
          metricBox("收藏", p.collects) +
          metricBox("分享", p.shares) +
          metricBox("涨粉", p.fansChange) +
          metricBox("互动率", rate.toFixed(1) + "%", true) +
          "</div>" +
          (p.note ? '<div style="color:var(--muted);font-size:12px;margin-top:7px">' + esc(p.note) + "</div>" : "") +
          "</div>";
      }).join("")
    : '<div class="empty">还没有发布记录，点右上角新增一条</div>';

  $("#view-posts").innerHTML =
    '<div class="view-head"><div><h2>数据复盘</h2><p>每条已发布内容手动录入一次，看板会自动统计</p></div>' +
    '<div class="head-actions"><button class="btn" onclick="openPostModal()">+ 新增发布记录</button></div></div>' +
    '<div class="stat-grid">' + summary + "</div>" +
    '<div class="card card-pad"><div class="toolbar" style="margin-bottom:14px">' +
    '<div class="search-input" style="flex:1;min-width:180px"><span class="icon">⌕</span>' +
    '<input type="text" id="post-search" placeholder="搜索标题或备注…" value="' + escAttr(postFilter.q) + '"></div>' +
    '<select id="post-pf-filter">' +
    '<option value="all">全部平台</option>' +
    PLATFORMS.map(function (p) {
      return '<option value="' + escAttr(p) + '"' + (postFilter.platform === p ? " selected" : "") + ">" + p + "</option>";
    }).join("") + "</select></div>" +
    rows + "</div>";

  const search = $("#post-search");
  if (search) search.oninput = function () {
    const pos = search.selectionStart;
    postFilter.q = search.value;
    renderPosts();
    const next = $("#post-search");
    if (next) { next.focus(); next.setSelectionRange(pos, pos); }
  };
  const pf = $("#post-pf-filter");
  if (pf) pf.onchange = function () { postFilter.platform = pf.value; renderPosts(); };
  $$("[data-edit-post]").forEach(function (b) {
    b.onclick = function () { openPostModal(b.dataset.editPost); };
  });
  $$("[data-del-post]").forEach(function (b) {
    b.onclick = function () { deletePost(b.dataset.delPost); };
  });
}

function metricBox(label, value, highlight) {
  return '<div class="metric-box"><div class="v' + (highlight ? " metric-highlight" : "") + '">' +
    (value === 0 || value ? fmtNum(value) : "0") + '</div><div class="k">' + label + "</div></div>";
}

function openPostModal(postId, prefill) {
  const p = postId ? state.posts.find(function (x) { return x.id === postId; }) : null;
  const src = p || prefill || {};
  const body =
    '<form id="app-form">' +
    '<div class="form-grid">' +
    '<div class="field full"><label>内容标题 *</label><input type="text" name="title" required value="' + escAttr(src.title || "") + '"></div>' +
    '<div class="field"><label>平台</label><select name="platform">' +
    PLATFORMS.map(function (x) { return "<option" + (src.platform === x ? " selected" : "") + ">" + x + "</option>"; }).join("") +
    "</select></div>" +
    '<div class="field"><label>内容形式</label><select name="form">' +
    FORMS.map(function (f) { return "<option" + (src.form === f ? " selected" : "") + ">" + f + "</option>"; }).join("") +
    "</select></div>" +
    '<div class="field"><label>发布日期</label><input type="date" name="publishDate" value="' + escAttr(src.publishDate || todayStr()) + '"></div>' +
    '<div class="field"><label>备注</label><input type="text" name="note" value="' + escAttr(src.note || "") + '" placeholder="例如：复盘想法、封面策略"></div>' +
    "</div>" +
    '<div class="field"><label>数据录入</label><div class="metric-edit">' +
    ["reads", "likes", "comments", "collects", "shares", "fansChange"].map(function (k) {
      const names = { reads: "阅读量", likes: "点赞", comments: "评论", collects: "收藏", shares: "分享", fansChange: "涨粉" };
      return '<div class="field"><label>' + names[k] + '</label><input type="number" name="' + k + '" min="0" value="' + num(src[k]) + '"></div>';
    }).join("") +
    "</div><div class='help'>互动率自动计算：(点赞 + 评论 + 收藏 + 分享) ÷ 阅读量</div></div>" +
    '<div class="field"><label>本次复盘</label><textarea name="review">' + esc(src.review || "") + "</textarea></div>" +
    "</form>";
  openModal(p ? "编辑发布记录" : "新增发布记录", body, modalButtons("取消", "保存记录"), true);
  $("#app-form").onsubmit = function (e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = {
      title: String(fd.get("title") || "").trim(),
      platform: String(fd.get("platform") || "小红书"),
      form: String(fd.get("form") || "图文"),
      publishDate: String(fd.get("publishDate") || todayStr()),
      reads: num(fd.get("reads")),
      likes: num(fd.get("likes")),
      comments: num(fd.get("comments")),
      collects: num(fd.get("collects")),
      shares: num(fd.get("shares")),
      fansChange: num(fd.get("fansChange")),
      note: String(fd.get("note") || "").trim(),
      review: String(fd.get("review") || "").trim()
    };
    if (!data.title) { toast("标题不能为空", "danger"); return; }
    if (p) Object.assign(p, data);
    else {
      data.id = uid();
      data.sample = false;
      data.createdAt = new Date().toISOString();
      state.posts.unshift(data);
    }
    saveState();
    closeModal();
    toast("发布记录已保存");
    goTab("posts");
    renderTabs();
  };
}

function deletePost(id) {
  confirmDialog("确定删除这条发布记录吗？", function () {
    state.posts = state.posts.filter(function (x) { return x.id !== id; });
    saveState();
    renderPosts();
    renderTabs();
    toast("已删除记录");
  });
}

/* ============ 数据看板 ============ */
function renderDashboard() {
  const posts = state.posts;
  const totalPosts = posts.length;
  const totalReads = posts.reduce(function (s, p) { return s + num(p.reads); }, 0);
  const rates = posts.map(postEngagement).filter(function (r) { return r > 0; });
  const avgRate = rates.length ? rates.reduce(function (a, b) { return a + b; }, 0) / rates.length : 0;
  const poolCount = state.ideas.filter(function (i) { return i.status === "pool"; }).length;

  function groupBy(getKey) {
    const map = {};
    posts.forEach(function (p) {
      const k = getKey(p);
      if (!map[k]) map[k] = { count: 0, reads: 0, rateSum: 0, rateN: 0 };
      map[k].count += 1;
      map[k].reads += num(p.reads);
      const r = postEngagement(p);
      if (r > 0) { map[k].rateSum += r; map[k].rateN += 1; }
    });
    return Object.keys(map).map(function (k) {
      return {
        key: k,
        count: map[k].count,
        reads: map[k].reads,
        rate: map[k].rateN ? map[k].rateSum / map[k].rateN : 0
      };
    });
  }

  const byPlatform = groupBy(function (p) { return p.platform || "其他"; })
    .sort(function (a, b) { return b.reads - a.reads; });
  const byForm = groupBy(function (p) { return p.form || "其他"; })
    .sort(function (a, b) { return b.reads - a.reads; });
  const maxPlat = Math.max.apply(null, byPlatform.map(function (x) { return x.reads; }).concat([1]));
  const maxForm = Math.max.apply(null, byForm.map(function (x) { return x.reads; }).concat([1]));

  const platBars = byPlatform.length ? byPlatform.map(function (x) {
    return '<div class="bar-row"><b>' + esc(x.key) + "</b>" +
      '<div class="bar-track"><i style="width:' + Math.round(x.reads / maxPlat * 100) + '%"></i></div>' +
      '<div class="bar-num">' + fmtNum(x.reads) + " · " + x.count + "篇</div></div>";
  }).join("") : '<div class="empty">录入发布数据后自动生成</div>';
  const formBars = byForm.length ? byForm.map(function (x) {
    return '<div class="bar-row"><b>' + esc(x.key) + "</b>" +
      '<div class="bar-track"><i style="width:' + Math.round(x.reads / maxForm * 100) + '%"></i></div>' +
      '<div class="bar-num">' + fmtNum(x.reads) + " · " + x.count + "篇</div></div>";
  }).join("") : '<div class="empty">录入发布数据后自动生成</div>';

  const withRate = posts.filter(function (p) { return num(p.reads) >= 50; });
  const sortedTop = (withRate.length ? withRate : posts).slice().sort(function (a, b) {
    return postEngagement(b) - postEngagement(a);
  }).slice(0, 5);
  const topHtml = sortedTop.length ? sortedTop.map(function (p, idx) {
    return '<div class="item"><div class="rank' + (idx < 3 ? " top" : "") + '">' + (idx + 1) + "</div>" +
      '<div style="flex:1;min-width:0"><div style="font-weight:600">' + esc(p.title) + "</div>" +
      '<div style="color:var(--muted);font-size:12px">' + platformChip(p.platform) +
      '<span style="margin-right:8px"></span>' + fmtNum(p.reads) + " 阅读 · 发布于 " + esc(p.publishDate) + "</div></div>" +
      '<b class="metric-highlight">' + postEngagement(p).toFixed(1) + "%</b></div>";
  }).join("") : '<div class="empty">暂无内容</div>';

  const insight = buildInsight(byPlatform, byForm);
  const stats =
    statCard("累计发布", String(totalPosts), "篇") +
    statCard("累计阅读", fmtNum(totalReads), "全平台") +
    statCard("平均互动率", avgRate.toFixed(1) + "%", "越高越好") +
    statCard("灵感储备", String(poolCount), "条待孵化");

  $("#view-dashboard").innerHTML =
    '<div class="view-head"><div><h2>数据看板</h2><p>你的内容数据都在这里，先录入后分析</p></div></div>' +
    '<div class="stat-grid">' + stats + "</div>" +
    '<div class="grid-2-equal">' +
    '<div class="card card-pad"><div class="sec-title"><h3>平台表现</h3><span class="hint">按总阅读排序</span></div>' + platBars + "</div>" +
    '<div class="card card-pad"><div class="sec-title"><h3>内容形式表现</h3></div>' + formBars + "</div>" +
    "</div>" +
    '<div class="card card-pad" style="margin-top:16px"><div class="sec-title"><h3>表现最好的内容</h3><span class="hint">互动率 = 互动总量 ÷ 阅读量</span></div>' +
    '<div class="top-list">' + topHtml + "</div></div>" +
    (insight ? '<div class="card card-pad" style="margin-top:16px;background:#f7faff"><div class="sec-title"><h3>一句话建议</h3></div>' +
      '<p style="margin:0;color:var(--text);font-size:14px">' + insight + "</p></div>" : "");
}

function buildInsight(byPlatform, byForm) {
  if (!state.posts.length) return "还没有发布数据。先把已发布的内容录入“数据复盘”，看板会自动给出建议。";
  const form = byForm[0];
  const plat = byPlatform[0];
  const best = state.posts.slice().sort(function (a, b) {
    return postEngagement(b) - postEngagement(a);
  })[0];
  const text = "目前看，你在" + plat.key + "的总阅读最高，";
  if (form && form.count > 1) {
    return text + "其中“" + form.key + "”贡献最多。表现最好的一条是《" + best.title + "》，可以拆解它的封面、开头和结构，复制到下一批内容里。";
  }
  return text + "继续保持更新节奏，数据积累到 10 条以上再做更稳定的判断。";
}

/* ============ 数据管理与初始化 ============ */
function exportBackup() {
  const payload = { version: 1, exportedAt: new Date().toISOString(), state: state };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "自媒体工作台备份-" + todayStr() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast("备份文件已导出");
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = function () {
    try {
      const payload = JSON.parse(reader.result);
      const data = payload.state || payload;
      if (!data.ideas || !data.schedules || !data.posts || !data.trackers) {
        throw new Error("格式不正确");
      }
      state = {
        ideas: data.ideas,
        schedules: data.schedules,
        posts: data.posts,
        trackers: data.trackers,
        seeded: true
      };
      saveState();
      goTab(activeTab);
      renderTabs();
      toast("备份导入成功");
    } catch (err) {
      toast("导入失败：文件格式不正确", "danger");
    }
  };
  reader.readAsText(file);
}

function clearSampleData() {
  const sampleCount = ["ideas", "schedules", "posts", "trackers"].reduce(function (n, key) {
    return n + state[key].filter(function (x) { return x.sample; }).length;
  }, 0);
  if (!sampleCount) {
    toast("当前没有示例数据");
    return;
  }
  confirmDialog("确定清空全部示例数据吗？你手动录入的数据会保留。", function () {
    ["ideas", "schedules", "posts", "trackers"].forEach(function (key) {
      state[key] = state[key].filter(function (x) { return !x.sample; });
    });
    saveState();
    goTab(activeTab);
    renderTabs();
    toast("示例数据已清空");
  });
}

function bindHeader() {
  $("#btn-export").onclick = exportBackup;
  $("#btn-import").onclick = function () { $("#import-file").click(); };
  $("#import-file").onchange = function () {
    if (this.files && this.files[0]) importBackup(this.files[0]);
    this.value = "";
  };
  $("#btn-clear-sample").onclick = clearSampleData;
}

renderTabs();
goTab("home");
bindHeader();
</script>
</script>
</body>
</html>
